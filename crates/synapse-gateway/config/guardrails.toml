# Named guardrail policies. Routes opt in via `policy = "<name>"` in routes.toml;
# routes with no policy fall back to "default", and are not scanned if "default"
# is undefined. Startup fails if this file is absent, unless
# SYNAPSE_GUARDRAILS=optional, which runs without guardrails.
#
# mode = "block" (default) rejects on a block-severity hit; mode = "observe"
# records a would-block metric and proceeds (safe rollout).

[guardrails.default]
scanners = [
  "prompt_injection",
  "secrets",
  # Scraped website/PDF markdown often embeds zero-width/bidi marks;
  # keep invisible_text on `strict` only.
  { type = "token_limit", max_chars = 200000 },
]

# Scraped website/PDF markdown — omit invisible_text.
[guardrails.scraped]
scanners = [
  "prompt_injection",
  "secrets",
  { type = "token_limit", max_chars = 200000 },
]

[guardrails.strict]
scanners = ["prompt_injection", "secrets", "pii", "role_override", "invisible_text"]

[guardrails.canary]
mode = "observe"
scanners = ["prompt_injection", "secrets"]

[guardrails.browser_agent]
scanners = [
  "prompt_injection",
  "secrets",
  { type = "token_limit", max_chars = 128000 },
]
